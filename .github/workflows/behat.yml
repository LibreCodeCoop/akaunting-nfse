name: Behat API Contracts

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: behat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  APP_ENV: testing
  APP_URL: http://127.0.0.1:8082
  DB_CONNECTION: sqlite
  MAIL_MAILER: array
  MAIL_FROM_ADDRESS: nfse-e2e@example.test
  MAIL_FROM_NAME: NFS-e E2E
  NFSE_TEST_HARNESS: '1'
  NFSE_BEHAT_DISPOSABLE: '1'

jobs:
  contracts:
    name: HTTP contracts (disposable Akaunting)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Akaunting core
        uses: actions/checkout@v7
        with:
          repository: akaunting/akaunting
          # Known-good core from the original green HTTP run of PR #508.
          ref: 4e2c8d4ffabe2ea5124cbc1ceab803b730b31d31
          path: akaunting

      - name: Checkout NFS-e module
        uses: actions/checkout@v7
        with:
          path: akaunting/modules/Nfse

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, json, mbstring, openssl, pdo, pdo_sqlite, soap, sqlite3, xml, zip
          coverage: none
          tools: composer

      - name: Prepare isolated Akaunting and synthetic fixtures
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/behat-ci.mjs prepare

      - name: Execute serial and randomized HTTP contracts
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/behat-ci.mjs run

      - name: Publish failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: behat-http-contracts
          if-no-files-found: ignore
          path: |
            akaunting/modules/Nfse/build/behat-junit/
            akaunting/modules/Nfse/build/behat/server.log
