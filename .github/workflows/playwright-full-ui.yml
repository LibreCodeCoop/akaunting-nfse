name: Playwright Full UI

on:
  pull_request:
    paths:
      - '.github/workflows/playwright-full-ui.yml'
      - 'scripts/ci/**'
      - 'frontend-tests/playwright-smoke-setup.test.mjs'
      - 'e2e/**'
      - 'Resources/views/**'
      - 'Resources/assets/**'
      - 'Resources/lang/**'
      - 'Routes/**'
      - 'Http/Controllers/**'
      - 'Providers/**'
      - 'Jobs/**'
      - 'Application/**'
      - 'playwright.config.ts'
      - '.github/workflows/playwright-smoke.yml'
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: playwright-full-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  APP_ENV: testing
  APP_URL: http://127.0.0.1:8082
  DB_CONNECTION: sqlite
  DB_DATABASE: ${{ github.workspace }}/akaunting/database/playwright.sqlite
  MAIL_MAILER: array
  MAIL_FROM_ADDRESS: nfse-e2e@example.test
  MAIL_FROM_NAME: NFS-e E2E

jobs:
  full_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Akaunting core
        uses: actions/checkout@v7
        with:
          repository: akaunting/akaunting
          ref: master
          path: akaunting

      - name: Checkout NFS-e module
        uses: actions/checkout@v7
        with:
          path: akaunting/modules/Nfse

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            akaunting/modules/Nfse/package-lock.json
            akaunting/package-lock.json

      - name: Test browser setup contracts
        working-directory: akaunting/modules/Nfse
        run: node --test frontend-tests/playwright-smoke-setup.test.mjs

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, json, mbstring, openssl, pdo, pdo_sqlite, soap, sqlite3, xml, zip
          coverage: none
          tools: composer

      - name: Prepare Akaunting test environment
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs prepare-env

      - name: Install Akaunting dependencies
        working-directory: akaunting
        run: composer test

      - name: Build scoped NFS-e runtime
        working-directory: akaunting/modules/Nfse
        run: |
          composer install --prefer-dist --no-progress --no-interaction --no-scripts
          composer thirdparty:install
          composer runtime-tools:install
          composer thirdparty:scope

      - name: Prepare persistent Akaunting test database
        working-directory: akaunting
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --class='\Database\Seeds\TestCompany' --force

      - name: Provision deterministic full UI fixtures
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs provision-full-ui

      - name: Cache compiled Akaunting browser assets
        uses: actions/cache@v6
        with:
          path: |
            akaunting/public/js/auth/common.min.js
            akaunting/public/js/common/dashboards.min.js
            akaunting/public/js/common/documents.min.js
            akaunting/public/js/common/items.min.js
            akaunting/public/css/app.css
          key: akaunting-browser-assets-${{ runner.os }}-${{ hashFiles('akaunting/package-lock.json', 'akaunting/webpack.mix.js', 'akaunting/resources/assets/**') }}

      - name: Prepare Akaunting browser assets
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs assets

      - name: Install Playwright
        working-directory: akaunting/modules/Nfse
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify persistent full UI database
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs verify-db

      - name: Expose module browser assets
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs expose-assets

      - name: Start Akaunting
        id: start_server
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs start-server

      - name: Run deterministic full UI suite
        working-directory: akaunting/modules/Nfse
        env:
          CI: 'true'
          NFSE_E2E_BASE_URL: http://127.0.0.1:8082
          NFSE_E2E_EMAIL: nfse-e2e@example.test
          NFSE_E2E_PASSWORD: 'NfseE2E!123456'
          NFSE_E2E_ITEM_VALIDATION_ID: ${{ env.NFSE_E2E_ITEM_VALIDATION_ID }}
          NFSE_E2E_GROUPED_INVOICE_ID: ${{ env.NFSE_E2E_GROUPED_INVOICE_ID }}
          NFSE_E2E_PENDING_INVOICE_ID: ${{ env.NFSE_E2E_PENDING_INVOICE_ID }}
          NFSE_E2E_BULK_READY_INVOICE_ID: ${{ env.NFSE_E2E_BULK_READY_INVOICE_ID }}
          NFSE_E2E_BULK_BLOCKED_INVOICE_ID: ${{ env.NFSE_E2E_BULK_BLOCKED_INVOICE_ID }}
        run: |
          npx playwright test --project=full-ui --retries=0

      - name: Stop Akaunting
        if: ${{ always() && (steps.start_server.outcome == 'success' || steps.start_server.outcome == 'failure') }}
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs stop-server

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-ui-artifacts
          if-no-files-found: ignore
          path: |
            akaunting/modules/Nfse/playwright-report
            akaunting/modules/Nfse/test-results
            akaunting/storage/logs/playwright-server.log
