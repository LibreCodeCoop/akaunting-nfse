name: Playwright Full UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: playwright-full-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  APP_ENV: testing
  APP_URL: http://127.0.0.1:8082
  DB_CONNECTION: sqlite
  DB_DATABASE: ${{ github.workspace }}/akaunting/database/playwright.sqlite
  MAIL_MAILER: array
  MAIL_FROM_ADDRESS: nfse-e2e@example.test
  MAIL_FROM_NAME: NFS-e E2E

jobs:
  full_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Akaunting core
        uses: actions/checkout@v7
        with:
          repository: akaunting/akaunting
          path: akaunting

      - name: Checkout NFS-e module
        uses: actions/checkout@v7
        with:
          path: akaunting/modules/Nfse

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, json, mbstring, openssl, pdo, pdo_sqlite, soap, sqlite3, xml, zip
          coverage: none
          tools: composer

      - name: Prepare Akaunting test environment
        working-directory: akaunting
        run: |
          cp .env.testing .env
          touch database/playwright.sqlite
          sed -i "s#^DB_CONNECTION=.*#DB_CONNECTION=sqlite#" .env
          sed -i "s#^DB_DATABASE=.*#DB_DATABASE=${PWD}/database/playwright.sqlite#" .env
          sed -i "s#^APP_URL=.*#APP_URL=http://127.0.0.1:8082#" .env
          {
            echo "MAIL_MAILER=array"
            echo "MAIL_FROM_ADDRESS=nfse-e2e@example.test"
            echo 'MAIL_FROM_NAME="NFS-e E2E"'
          } >> .env

      - name: Install Akaunting dependencies
        working-directory: akaunting
        run: composer test

      - name: Build scoped NFS-e runtime
        working-directory: akaunting/modules/Nfse
        run: |
          composer install --prefer-dist --no-progress --no-interaction --no-scripts
          composer thirdparty:install
          composer runtime-tools:install
          composer thirdparty:scope

      - name: Prepare persistent Akaunting test database
        working-directory: akaunting
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --class='\Database\Seeds\TestCompany' --force

      - name: Provision deterministic NFS-e test user
        working-directory: akaunting
        run: |
          php artisan nfse:test-user:provision \
            --company-id=1 \
            --email=nfse-e2e@example.test \
            --password=NfseE2E!123456 \
            --role=admin \
            --landing-page=dashboard \
            --json

      - name: Provision deterministic NFS-e fiscal harness
        working-directory: akaunting
        env:
          NFSE_TEST_HARNESS: '1'
        run: |
          FIXTURE_JSON="$(php artisan nfse:test-harness:provision \
            --company-id=1 \
            --cnpj=11222333000181 \
            --municipio=3303302 \
            --item-lista=0107 \
            --codigo-nacional=010701 \
            --password=nfse-test-password \
            --substitution-fixture \
            --adn-review-fixture \
            --item-validation-fixture \
            --grouped-invoice-fixture \
            --pending-invoice-fixture \
            --json)"
          echo "$FIXTURE_JSON"
          SUBSTITUTION_INVOICE_ID="$(printf '%s' "$FIXTURE_JSON" | php -r '$payload = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo (int) ($payload["substitution_invoice_id"] ?? 0);')"
          test "$SUBSTITUTION_INVOICE_ID" -gt 0
          echo "NFSE_E2E_SUBSTITUTION_INVOICE_ID=$SUBSTITUTION_INVOICE_ID" >> "$GITHUB_ENV"
          ADN_REVIEW_DOCUMENT_ID="$(printf '%s' "$FIXTURE_JSON" | php -r '$payload = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo (int) ($payload["adn_review_document_id"] ?? 0);')"
          ADN_VENDOR_ID="$(printf '%s' "$FIXTURE_JSON" | php -r '$payload = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo (int) ($payload["adn_vendor_id"] ?? 0);')"
          ADN_CATEGORY_ID="$(printf '%s' "$FIXTURE_JSON" | php -r '$payload = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo (int) ($payload["adn_category_id"] ?? 0);')"
          ADN_ITEM_ID="$(printf '%s' "$FIXTURE_JSON" | php -r '$payload = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo (int) ($payload["adn_item_id"] ?? 0);')"
          test "$ADN_REVIEW_DOCUMENT_ID" -gt 0
          test "$ADN_VENDOR_ID" -gt 0
          test "$ADN_CATEGORY_ID" -gt 0
          test "$ADN_ITEM_ID" -gt 0
          echo "NFSE_E2E_ADN_REVIEW_DOCUMENT_ID=$ADN_REVIEW_DOCUMENT_ID" >> "$GITHUB_ENV"
          echo "NFSE_E2E_ADN_VENDOR_ID=$ADN_VENDOR_ID" >> "$GITHUB_ENV"
          echo "NFSE_E2E_ADN_CATEGORY_ID=$ADN_CATEGORY_ID" >> "$GITHUB_ENV"
          echo "NFSE_E2E_ADN_ITEM_ID=$ADN_ITEM_ID" >> "$GITHUB_ENV"
          ITEM_VALIDATION_ITEM_ID="$(printf '%s' "$FIXTURE_JSON" | php -r '$payload = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo (int) ($payload["item_validation_item_id"] ?? 0);')"
          test "$ITEM_VALIDATION_ITEM_ID" -gt 0
          echo "NFSE_E2E_ITEM_VALIDATION_ID=$ITEM_VALIDATION_ITEM_ID" >> "$GITHUB_ENV"
          GROUPED_INVOICE_ID="$(printf '%s' "$FIXTURE_JSON" | php -r '$payload = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo (int) ($payload["grouped_invoice_id"] ?? 0);')"
          test "$GROUPED_INVOICE_ID" -gt 0
          echo "NFSE_E2E_GROUPED_INVOICE_ID=$GROUPED_INVOICE_ID" >> "$GITHUB_ENV"
          PENDING_INVOICE_ID="$(printf '%s' "$FIXTURE_JSON" | php -r '$payload = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR); echo (int) ($payload["pending_invoice_id"] ?? 0);')"
          test "$PENDING_INVOICE_ID" -gt 0
          echo "NFSE_E2E_PENDING_INVOICE_ID=$PENDING_INVOICE_ID" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: akaunting/modules/Nfse/package-lock.json

      - name: Install Playwright
        working-directory: akaunting/modules/Nfse
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify persistent full UI database
        working-directory: akaunting
        run: |
          php artisan tinker --execute='
            if (!\Illuminate\Support\Facades\Schema::hasTable("users")) { throw new RuntimeException("users table missing from Playwright SQLite database"); }
            $userModel = user_model_class();
            if (!$userModel::query()->where("email", "nfse-e2e@example.test")->exists()) { throw new RuntimeException("Playwright test user missing from persistent database"); }
          '

      - name: Expose module browser assets
        working-directory: akaunting
        run: |
          mkdir -p public/modules
          ln -sfn "${PWD}/modules/Nfse" public/modules/Nfse
          test -f public/modules/Nfse/Resources/assets/js/adn-distribution-browser.js

      - name: Start Akaunting
        working-directory: akaunting
        env:
          NFSE_TEST_HARNESS: '1'
          NFSE_TEST_CNPJ: '11222333000181'
          NFSE_TEST_PFX_PASSWORD: 'nfse-test-password'
        run: |
          export NFSE_TEST_PFX_PATH="${PWD}/storage/app/nfse/pfx/11222333000181.pfx"
          nohup php artisan serve --host=127.0.0.1 --port=8082 > storage/logs/playwright-server.log 2>&1 &
          echo $! > /tmp/akaunting-playwright.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8082/auth/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/playwright-server.log
          exit 1

      - name: Run deterministic full UI suite
        working-directory: akaunting/modules/Nfse
        env:
          CI: 'true'
          NFSE_E2E_BASE_URL: http://127.0.0.1:8082
          NFSE_E2E_EMAIL: nfse-e2e@example.test
          NFSE_E2E_PASSWORD: 'NfseE2E!123456'
          NFSE_E2E_ITEM_VALIDATION_ID: ${{ env.NFSE_E2E_ITEM_VALIDATION_ID }}
          NFSE_E2E_GROUPED_INVOICE_ID: ${{ env.NFSE_E2E_GROUPED_INVOICE_ID }}
          NFSE_E2E_PENDING_INVOICE_ID: ${{ env.NFSE_E2E_PENDING_INVOICE_ID }}
        run: |
          npx playwright test --project=full-ui --retries=0

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-ui-artifacts
          if-no-files-found: ignore
          path: |
            akaunting/modules/Nfse/playwright-report
            akaunting/modules/Nfse/test-results
            akaunting/storage/logs/playwright-server.log
