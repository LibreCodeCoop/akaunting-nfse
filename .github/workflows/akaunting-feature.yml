name: Akaunting Feature

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: akaunting-feature-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache

jobs:
  feature_shard:
    name: feature-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Akaunting
        uses: actions/checkout@v7
        with:
          repository: akaunting/akaunting
          ref: master

      - name: Checkout NFS-e module
        uses: actions/checkout@v7
        with:
          path: modules/Nfse

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, json, mbstring, openssl, pdo, pdo_sqlite, soap, sqlite, xml, zip
          coverage: none
          tools: composer

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}/files
          key: nfse-playwright-composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'modules/Nfse/composer.json', 'modules/Nfse/3rdparty/composer.json', 'modules/Nfse/vendor-bin/php-scoper/composer.lock') }}
          restore-keys: |
            nfse-playwright-composer-${{ runner.os }}-

      - name: Install module and resolve scoped runtime dependencies
        working-directory: modules/Nfse
        run: |
          composer install --prefer-dist --no-progress --no-interaction --no-scripts
          composer thirdparty:install

      # All four feature shards use isolated databases but the same immutable
      # scoped PHP sources as deterministic Playwright jobs.
      - name: Cache scoped NFS-e runtime
        id: scoped_runtime
        uses: actions/cache@v6
        with:
          path: modules/Nfse/3rdparty/scoped
          key: nfse-playwright-scoped-${{ runner.os }}-php83-${{ hashFiles('modules/Nfse/3rdparty/composer.json', 'modules/Nfse/3rdparty/composer.lock', 'modules/Nfse/3rdparty/scoper.inc.php', 'modules/Nfse/vendor-bin/php-scoper/composer.lock') }}

      - name: Build scoped NFS-e runtime on cache miss
        if: steps.scoped_runtime.outputs.cache-hit != 'true'
        working-directory: modules/Nfse
        run: |
          composer runtime-tools:install
          composer thirdparty:scope

      - name: Verify scoped runtime exists
        working-directory: modules/Nfse
        run: |
          test -s 3rdparty/scoped/autoload.php
          php -l 3rdparty/scoped/autoload.php

      - name: Verify DANFSe resources in production module archive
        working-directory: modules/Nfse
        run: |
          bash tools/bin/build-module-archive.sh 0.0.0-ci
          php tools/bin/verify-danfse-package.php akaunting-nfse-0.0.0-ci.zip

      - name: Ensure PDF evidence utilities
        run: |
          if command -v pdfinfo >/dev/null 2>&1 && command -v pdftotext >/dev/null 2>&1; then
            echo "Using preinstalled poppler-utils."
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends poppler-utils
          fi

      - name: Prepare Akaunting test application
        run: |
          cp .env.testing .env
          # Akaunting maps Modules\\ to the whole modules/ tree. Its default
          # optimized autoloader recursively scans module-local vendor tooling
          # (including vendor-bin) that is intentionally outside that namespace.
          # Feature tests only need PSR-4 resolution, not an optimized classmap.
          composer config optimize-autoloader false
          composer test

      - name: Run NFS-e Feature tests (isolated shard ${{ matrix.shard }})
        env:
          NFSE_FEATURE_SHARD_INDEX: ${{ matrix.shard }}
          NFSE_FEATURE_SHARD_COUNT: 4
        run: bash modules/Nfse/tools/bin/run-feature-shard.sh

  # Preserve the existing required check without changes to branch rulesets.
  # Each matrix entry gets a separate disposable runner, database and filesystem.
  feature:
    name: feature
    needs: feature_shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all isolated feature shards to pass
        env:
          SHARD_RESULT: ${{ needs.feature_shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "An isolated Akaunting Feature shard failed or was cancelled."
            exit 1
          fi
