name: PHPUnit

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: phpunit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_CACHE_DIR: ${{ runner.temp }}/composer-cache

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v7
        with:
          path: modules/Nfse

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('modules/Nfse/composer.json', 'modules/Nfse/3rdparty/composer.json', 'modules/Nfse/vendor-bin/php-scoper/composer.lock', 'modules/Nfse/vendor-bin/phpunit/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-
            composer-${{ runner.os }}-

      - name: Install PHPUnit and runtime dependencies
        working-directory: modules/Nfse
        run: |
          composer install --prefer-dist --no-progress --no-scripts
          composer thirdparty:install
          composer runtime-tools:install
          composer --working-dir=vendor-bin/phpunit install --prefer-dist --no-progress --no-interaction
          composer thirdparty:scope

      - name: Run PHPUnit (Unit)
        working-directory: modules/Nfse
        run: composer test:unit
