name: Playwright Bulk UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'BulkActions/Invoices.php'
      - 'Providers/Main.php'
      - 'Resources/assets/js/native-invoice-list-status.js'
      - 'Resources/assets/js/native-invoice-list-status.min.js'
      - 'frontend-tests/native-invoice-list-status.test.mjs'
      - 'e2e/nfse-bulk-emission.spec.ts'
      - 'Http/Controllers/BulkEmissionController.php'
      - 'Application/BulkEmissionDispatcher.php'
      - 'Application/BulkEmissionPlanner.php'
      - 'Application/BulkEmissionStatusPolicy.php'
      - '.github/workflows/playwright-bulk-ui.yml'
      - 'scripts/ci/**'
      - 'frontend-tests/playwright-smoke-setup.test.mjs'
      - 'e2e/global-setup.ts'
      - 'e2e/support/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: playwright-bulk-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache
  APP_ENV: testing
  APP_URL: http://127.0.0.1:8082
  DB_CONNECTION: sqlite
  DB_DATABASE: ${{ github.workspace }}/akaunting/database/playwright.sqlite
  MAIL_MAILER: array
  MAIL_FROM_ADDRESS: nfse-e2e@example.test
  MAIL_FROM_NAME: NFS-e E2E

jobs:
  bulk_ui:
    # Chromium in the locked Playwright version does not support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Akaunting core
        uses: actions/checkout@v7
        with:
          repository: akaunting/akaunting
          ref: master
          path: akaunting

      - name: Checkout NFS-e module
        uses: actions/checkout@v7
        with:
          path: akaunting/modules/Nfse

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            akaunting/modules/Nfse/package-lock.json
            akaunting/package-lock.json

      - name: Test browser setup contracts
        working-directory: akaunting/modules/Nfse
        run: node --test frontend-tests/playwright-smoke-setup.test.mjs

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, json, mbstring, openssl, pdo, pdo_sqlite, soap, sqlite3, xml, zip
          coverage: none
          tools: composer

      - name: Prepare Akaunting test environment
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs prepare-env

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}/files
          key: nfse-playwright-composer-${{ runner.os }}-${{ hashFiles('akaunting/composer.lock', 'akaunting/modules/Nfse/composer.json', 'akaunting/modules/Nfse/3rdparty/composer.json', 'akaunting/modules/Nfse/vendor-bin/php-scoper/composer.lock') }}
          restore-keys: |
            nfse-playwright-composer-${{ runner.os }}-

      - name: Install Akaunting dependencies
        working-directory: akaunting
        run: composer test

      - name: Install NFS-e module and resolve scoped runtime dependencies
        working-directory: akaunting/modules/Nfse
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          composer install --prefer-dist --no-progress --no-interaction --no-scripts
          composer thirdparty:install

      # The untracked lock is generated above; include it to prevent stale scoped
      # output when an unlocked transitive dependency changes. No fixtures or secrets.
      - name: Cache scoped NFS-e runtime
        id: scoped_runtime
        uses: actions/cache@v6
        with:
          path: akaunting/modules/Nfse/3rdparty/scoped
          key: nfse-playwright-scoped-${{ runner.os }}-php83-${{ hashFiles('akaunting/modules/Nfse/3rdparty/composer.json', 'akaunting/modules/Nfse/3rdparty/composer.lock', 'akaunting/modules/Nfse/3rdparty/scoper.inc.php', 'akaunting/modules/Nfse/vendor-bin/php-scoper/composer.lock') }}

      - name: Build scoped NFS-e runtime on cache miss
        if: steps.scoped_runtime.outputs.cache-hit != 'true'
        working-directory: akaunting/modules/Nfse
        run: |
          composer runtime-tools:install
          composer thirdparty:scope

      - name: Verify scoped runtime exists
        working-directory: akaunting/modules/Nfse
        run: |
          test -s 3rdparty/scoped/autoload.php
          php -l 3rdparty/scoped/autoload.php

      - name: Prepare persistent Akaunting test database
        working-directory: akaunting
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --class='\Database\Seeds\TestCompany' --force

      - name: Provision deterministic bulk UI fixtures
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs provision-bulk-ui

      - name: Cache compiled Akaunting browser assets
        uses: actions/cache@v6
        with:
          path: |
            akaunting/public/js/auth/common.min.js
            akaunting/public/js/common/dashboards.min.js
            akaunting/public/js/common/documents.min.js
            akaunting/public/js/common/items.min.js
            akaunting/public/js/settings/categories.min.js
            akaunting/public/css/app.css
          key: akaunting-browser-assets-${{ runner.os }}-${{ hashFiles('akaunting/package-lock.json', 'akaunting/webpack.mix.js', 'akaunting/resources/assets/**') }}

      - name: Prepare Akaunting browser assets
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs assets

      # Cache locked browser binaries, never mutable SQLite/PFX fixtures.
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('akaunting/modules/Nfse/package-lock.json') }}

      - name: Install Playwright
        working-directory: akaunting/modules/Nfse
        run: |
          npm ci --include=dev
          npx playwright install chromium

      - name: Verify persistent bulk database
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs verify-db

      - name: Expose module browser assets
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs expose-assets

      - name: Start Akaunting
        id: start_server
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs start-server

      - name: Run bulk UI scenario
        working-directory: akaunting/modules/Nfse
        env:
          CI: 'true'
          NFSE_E2E_BASE_URL: http://127.0.0.1:8082
          NFSE_E2E_EMAIL: nfse-e2e@example.test
          NFSE_E2E_PASSWORD: 'NfseE2E!123456'
          NFSE_E2E_BULK_READY_INVOICE_ID: ${{ env.NFSE_E2E_BULK_READY_INVOICE_ID }}
          NFSE_E2E_BULK_BLOCKED_INVOICE_ID: ${{ env.NFSE_E2E_BULK_BLOCKED_INVOICE_ID }}
        run: npm run test:e2e:bulk

      - name: Stop Akaunting
        if: ${{ always() && (steps.start_server.outcome == 'success' || steps.start_server.outcome == 'failure') }}
        working-directory: akaunting/modules/Nfse
        run: node scripts/ci/playwright-smoke.mjs stop-server

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-bulk-ui-artifacts
          if-no-files-found: ignore
          path: |
            akaunting/modules/Nfse/playwright-report
            akaunting/modules/Nfse/test-results
            akaunting/storage/logs/playwright-server.log
