name: Lint PHP CS

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: php-cs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_CACHE_DIR: /tmp/composer-cache

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: modules/Nfse

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ runner.os }}-php-cs-${{ hashFiles('modules/Nfse/composer.json', 'modules/Nfse/3rdparty/composer.json', 'modules/Nfse/vendor-bin/php-scoper/composer.lock', 'modules/Nfse/vendor-bin/php-cs-fixer/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-cs-
            composer-${{ runner.os }}-

      - name: Install PHP-CS-Fixer and runtime dependencies
        working-directory: modules/Nfse
        run: |
          composer install --prefer-dist --no-progress --no-scripts
          composer thirdparty:install
          composer runtime-tools:install
          composer --working-dir=vendor-bin/php-cs-fixer install --prefer-dist --no-progress --no-interaction
          composer thirdparty:scope

      - name: Run PHP-CS-Fixer (check only)
        working-directory: modules/Nfse
        run: composer cs:check
