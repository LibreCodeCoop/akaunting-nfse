name: Psalm Static Analysis

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: psalm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_CACHE_DIR: ${{ runner.temp }}/composer-cache

jobs:
  psalm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: modules/Nfse

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ runner.os }}-psalm-${{ hashFiles('modules/Nfse/composer.json', 'modules/Nfse/3rdparty/composer.json', 'modules/Nfse/vendor-bin/php-scoper/composer.lock', 'modules/Nfse/vendor-bin/psalm/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-psalm-
            composer-${{ runner.os }}-

      - name: Install Psalm and runtime dependencies
        working-directory: modules/Nfse
        run: |
          composer install --prefer-dist --no-progress --no-scripts
          composer thirdparty:install
          composer runtime-tools:install
          composer --working-dir=vendor-bin/psalm install --prefer-dist --no-progress --no-interaction
          composer thirdparty:scope

      - name: Run Psalm
        working-directory: modules/Nfse
        run: composer psalm -- --output-format=github
