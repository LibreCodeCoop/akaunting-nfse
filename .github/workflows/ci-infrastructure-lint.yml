name: CI Infrastructure Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/**'
      - 'frontend-tests/playwright-smoke-setup.test.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflow expressions and shell commands
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.7.11 --repo rhysd/actionlint --pattern 'actionlint_1.7.11_linux_amd64.tar.gz'
          gh attestation verify actionlint_1.7.11_linux_amd64.tar.gz --repo rhysd/actionlint
          tar -xzf actionlint_1.7.11_linux_amd64.tar.gz actionlint
          ./actionlint -shellcheck "$(command -v shellcheck)" .github/workflows/*.yml
