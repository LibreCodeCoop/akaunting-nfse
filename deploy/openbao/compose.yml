# Optional standalone secret store for the NFS-e module. The Akaunting runtime
# is intentionally NOT part of this project. State lives under the Git-ignored volumes/ directory.
name: nfse-secrets

services:
  openbao:
    image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    restart: unless-stopped
    command: [server]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao.hcl:/openbao/config/openbao.hcl:ro
      - ../../volumes/openbao/data:/openbao/file
    secrets:
      - openbao_static_seal_key
    networks:
      openbao-backend:
        aliases: [openbao]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_swappiness: 0
    healthcheck:
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  openbao-backend:
    name: ${OPENBAO_NETWORK:-nfse-openbao}
    driver: bridge
    internal: true

secrets:
  openbao_static_seal_key:
    file: ../../volumes/openbao/seal.key
